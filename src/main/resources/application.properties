# Jadicale configuration
jadicale.passwd-file=${user.home}/.jadicale/passwd
jadicale.storage-dir=${user.home}/.jadicale/collections

# Pass OPTIONS through to our handler instead of Spring MVC's built-in handling
spring.mvc.dispatch-options-request=true

# Spring Boot server (standalone mode; ignored when deployed as WAR)
server.port=8080

# Disable Spring Security's auto-generated password
spring.security.user.name=ignored
